name: Compatibility syntax checks

on:
  push:
    branches:
      - main
      - "compat/**"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python3-syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Compile with Python 3
        run: python -m py_compile nukeris.py

  python2-syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compile with Python 2.7
        run: docker run --rm -v "$PWD:/work" -w /work python:2.7 python -m py_compile nukeris.py
