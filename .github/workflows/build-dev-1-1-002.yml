name: Build NUKERIS dev 1.1.002

on:
  push:
    branches:
      - compat/nuke12-17
    paths:
      - tools/build_dev_1_1_002.py
      - .github/workflows/build-dev-1-1-002.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-dev:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: compat/nuke12-17

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Build dev file
        run: python tools/build_dev_1_1_002.py

      - name: Validate Python 3 syntax
        run: python -m py_compile nukeris_dev_1_1_002.py

      - name: Commit dev file
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add nukeris_dev_1_1_002.py
          if git diff --cached --quiet; then
            echo "No dev file change required."
          else
            git commit -m "Add NUKERIS v1.1.0-dev.2 persistent best score"
            git push origin HEAD:compat/nuke12-17
          fi
