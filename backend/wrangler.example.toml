name = "nukeris-ranking"
main = "src/worker.mjs"
compatibility_date = "2026-09-10"
workers_dev = false
preview_urls = false

[observability]
enabled = false

[[d1_databases]]
binding = "DB"
database_name = "nukeris-ranking"
database_id = "REPLACE_WITH_APPROVED_DATABASE_ID"
migrations_dir = "migrations"

[[ratelimits]]
name = "REQUEST_LIMITER"
namespace_id = "1001"
simple = { limit = 60, period = 60 }

[[ratelimits]]
name = "REGISTER_LIMITER"
namespace_id = "1002"
simple = { limit = 5, period = 60 }

# Provision RUN_SIGNING_KEY as a Worker secret after approval. Never put it here.
